<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MSN Messenger</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Tahoma, Arial, sans-serif;
    background: #6e9ec9 url('') no-repeat center center fixed;
    background: linear-gradient(135deg, #a9d4ff 0%, #6e9ec9 100%);
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ---------- Window frame ---------- */
  .window {
    width: 360px;
    background: #ece9f1;
    border: 1px solid #1b5fa8;
    border-radius: 6px 6px 0 0;
    box-shadow: 0 4px 20px rgba(0,0,0,0.35);
    overflow: hidden;
  }
  .titlebar {
    background: linear-gradient(180deg, #4f9eea 0%, #1b5fa8 100%);
    color: #fff;
    padding: 6px 10px;
    font-size: 13px;
    font-weight: bold;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .titlebar .dots span {
    display: inline-block;
    width: 10px; height: 10px;
    background: #fff; opacity: 0.5;
    border-radius: 2px;
    margin-right: 4px;
  }

  /* ---------- Login screen ---------- */
  .login-body {
    padding: 30px 24px;
    text-align: center;
  }
  .login-body h2 {
    color: #1b5fa8;
    font-size: 20px;
    margin-bottom: 4px;
  }
  .login-body p {
    color: #555;
    font-size: 12px;
    margin-bottom: 20px;
  }
  .field {
    margin-bottom: 12px;
    text-align: right;
  }
  .field label {
    display: block;
    font-size: 12px;
    color: #333;
    margin-bottom: 4px;
  }
  .field input {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid #9fb6ce;
    border-radius: 3px;
    font-size: 13px;
    font-family: inherit;
  }
  .field input:focus { outline: 2px solid #4f9eea; }
  .btn {
    width: 100%;
    padding: 9px;
    margin-top: 8px;
    border: none;
    border-radius: 3px;
    background: linear-gradient(180deg, #6cc24a 0%, #4a9c2d 100%);
    color: #fff;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
  }
  .btn:active { filter: brightness(0.95); }
  .error-msg {
    color: #c0392b;
    font-size: 12px;
    margin-top: 8px;
    min-height: 16px;
  }

  /* ---------- Contact list ---------- */
  .contacts-body { display: none; flex-direction: column; height: 480px; }
  .me-bar {
    background: #fff;
    padding: 10px 12px;
    display: flex;
    align-items: center;
    border-bottom: 1px solid #d6e1ef;
  }
  .avatar {
    width: 32px; height: 32px;
    border-radius: 4px;
    background: linear-gradient(135deg,#6cc24a,#4a9c2d);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-weight: bold;
    margin-left: 8px;
    flex-shrink: 0;
  }
  .me-info { flex: 1; }
  .me-info .name { font-weight: bold; font-size: 13px; color: #1b5fa8; }
  .me-info .status { font-size: 11px; color: #4a9c2d; }
  .logout-btn {
    font-size: 11px;
    color: #1b5fa8;
    cursor: pointer;
    text-decoration: underline;
    background: none; border: none;
  }
  .group-label {
    background: #dceaf7;
    padding: 6px 10px;
    font-size: 12px;
    font-weight: bold;
    color: #1b5fa8;
  }
  .contact-list { flex: 1; overflow-y: auto; background: #fff; }
  .contact-item {
    display: flex;
    align-items: center;
    padding: 10px 12px;
    cursor: pointer;
    border-bottom: 1px solid #f0f3f8;
  }
  .contact-item:hover { background: #eaf3fc; }
  .contact-item .avatar { background: linear-gradient(135deg,#6cc24a,#4a9c2d); width: 28px; height: 28px; font-size: 12px; }
  .contact-item .name { font-size: 13px; color: #222; }
  .contact-item .sub { font-size: 11px; color: #4a9c2d; }
  .empty-hint {
    text-align: center;
    color: #999;
    font-size: 12px;
    padding: 30px 10px;
  }

  /* ---------- Chat window ---------- */
  .chat-body { display: none; flex-direction: column; height: 480px; }
  .chat-header {
    background: #fff;
    padding: 8px 12px;
    border-bottom: 1px solid #d6e1ef;
    display: flex;
    align-items: center;
  }
  .chat-header .back-btn {
    background: none; border: none;
    color: #1b5fa8;
    font-size: 18px;
    cursor: pointer;
    margin-left: 8px;
  }
  .chat-header .name { font-size: 14px; font-weight: bold; color: #1b5fa8; }
  .messages {
    flex: 1;
    overflow-y: auto;
    background: #fff url('') ;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .msg-row { display: flex; }
  .msg-row.me { justify-content: flex-start; }
  .msg-row.them { justify-content: flex-end; }
  .bubble {
    max-width: 75%;
    padding: 8px 12px;
    border-radius: 12px;
    font-size: 13px;
    line-height: 1.4;
    word-wrap: break-word;
  }
  .msg-row.me .bubble {
    background: #dcf2c1;
    border: 1px solid #b6dd8e;
    border-bottom-left-radius: 2px;
  }
  .msg-row.them .bubble {
    background: #eaf3fc;
    border: 1px solid #c9e0f7;
    border-bottom-right-radius: 2px;
  }
  .bubble .meta {
    font-size: 10px;
    color: #999;
    margin-top: 3px;
    text-align: left;
  }
  .input-bar {
    display: flex;
    border-top: 1px solid #d6e1ef;
    background: #f5f8fc;
    padding: 8px;
    gap: 6px;
  }
  .input-bar input {
    flex: 1;
    padding: 8px 10px;
    border: 1px solid #9fb6ce;
    border-radius: 14px;
    font-size: 13px;
    font-family: inherit;
  }
  .input-bar input:focus { outline: none; border-color: #4f9eea; }
  .input-bar button {
    background: linear-gradient(180deg, #6cc24a 0%, #4a9c2d 100%);
    color: #fff;
    border: none;
    border-radius: 14px;
    padding: 0 16px;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
  }

  .loading { text-align:center; font-size:12px; color:#999; padding: 10px; }
</style>
</head>
<body>

<div class="window">

  <!-- Title bar -->
  <div class="titlebar">
    <span id="titleText">MSN Messenger</span>
    <span class="dots"><span></span><span></span><span></span></span>
  </div>

  <!-- Login Screen -->
  <div class="login-body" id="loginScreen">
    <h2>تسجيل الدخول</h2>
    <p>أدخل بياناتك للدخول إلى المحادثة</p>
    <div class="field">
      <label>اسم المستخدم</label>
      <input type="text" id="loginUser" placeholder="اسم المستخدم">
    </div>
    <div class="field">
      <label>كلمة المرور</label>
      <input type="password" id="loginPass" placeholder="كلمة المرور">
    </div>
    <button class="btn" id="loginBtn" onclick="doLogin()">دخول</button>
    <div class="error-msg" id="loginError"></div>
  </div>

  <!-- Contacts Screen -->
  <div class="contacts-body" id="contactsScreen">
    <div class="me-bar">
      <div class="avatar" id="meAvatar">A</div>
      <div class="me-info">
        <div class="name" id="meName">-</div>
        <div class="status">متصل الآن</div>
      </div>
      <button class="logout-btn" onclick="doLogout()">خروج</button>
    </div>
    <div class="group-label">جهات الاتصال</div>
    <div class="contact-list" id="contactList">
      <div class="loading">جاري التحميل...</div>
    </div>
  </div>

  <!-- Chat Screen -->
  <div class="chat-body" id="chatScreen">
    <div class="chat-header">
      <button class="back-btn" onclick="backToContacts()">→</button>
      <div class="name" id="chatWithName">-</div>
    </div>
    <div class="messages" id="messagesBox"></div>
    <div class="input-bar">
      <input type="text" id="msgInput" placeholder="اكتب رسالتك..." onkeypress="if(event.key==='Enter') sendMsg()">
      <button onclick="sendMsg()">إرسال</button>
    </div>
  </div>

</div>

<script>
// ===================== CONFIG =====================
// ضع هنا رابط الويب اب الخاص بـ Google Apps Script (بعد النشر)
const API_URL = "https://script.google.com/macros/s/AKfycbyQuKOdcAzeRyS8V6GIYhuXy0HKp7X-3cDH9CKQ2rm7eCGLx7j9hRFaAC0aJPBswcD1/exec";
// ===================================================

let currentUser = null;   // { username, displayName }
let currentChatWith = null;
let pollInterval = null;
let lastTimestamp = 0;

// ---- Helper: call API ----
async function api(params) {
  const url = new URL(API_URL);
  Object.keys(params).forEach(k => url.searchParams.append(k, params[k]));
  const res = await fetch(url);
  return res.json();
}

// ---- Login ----
async function doLogin() {
  const username = document.getElementById('loginUser').value.trim();
  const password = document.getElementById('loginPass').value.trim();
  const errorBox = document.getElementById('loginError');
  errorBox.textContent = '';

  if (!username || !password) {
    errorBox.textContent = 'من فضلك ادخل اسم المستخدم وكلمة المرور';
    return;
  }

  document.getElementById('loginBtn').textContent = 'جاري الدخول...';

  try {
    const result = await api({ action: 'login', username, password });
    if (result.success) {
      currentUser = { username: result.username, displayName: result.displayName };
      sessionStorage.setItem('msn_user', JSON.stringify(currentUser));
      showContacts();
    } else {
      errorBox.textContent = result.error || 'بيانات غير صحيحة';
    }
  } catch (e) {
    errorBox.textContent = 'حدث خطأ، حاول مرة أخرى';
  }
  document.getElementById('loginBtn').textContent = 'دخول';
}

function doLogout() {
  currentUser = null;
  sessionStorage.removeItem('msn_user');
  stopPolling();
  document.getElementById('loginScreen').style.display = 'block';
  document.getElementById('contactsScreen').style.display = 'none';
  document.getElementById('chatScreen').style.display = 'none';
  document.getElementById('titleText').textContent = 'MSN Messenger';
  document.getElementById('loginUser').value = '';
  document.getElementById('loginPass').value = '';
}

// ---- Show contacts list ----
async function showContacts() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('chatScreen').style.display = 'none';
  document.getElementById('contactsScreen').style.display = 'flex';
  document.getElementById('titleText').textContent = 'MSN - ' + currentUser.displayName;

  document.getElementById('meName').textContent = currentUser.displayName;
  document.getElementById('meAvatar').textContent = currentUser.displayName.charAt(0);

  const listEl = document.getElementById('contactList');
  listEl.innerHTML = '<div class="loading">جاري التحميل...</div>';

  try {
    const result = await api({ action: 'getUsers', username: currentUser.username });
    if (result.success && result.users.length > 0) {
      listEl.innerHTML = '';
      result.users.forEach(u => {
        const div = document.createElement('div');
        div.className = 'contact-item';
        div.onclick = () => openChat(u);
        div.innerHTML = `
          <div class="avatar">${u.displayName.charAt(0)}</div>
          <div>
            <div class="name">${u.displayName}</div>
            <div class="sub">اضغط للمحادثة</div>
          </div>`;
        listEl.appendChild(div);
      });
    } else {
      listEl.innerHTML = '<div class="empty-hint">لا يوجد أصحاب مضافين بعد</div>';
    }
  } catch (e) {
    listEl.innerHTML = '<div class="empty-hint">خطأ في تحميل القائمة</div>';
  }
}

// ---- Open chat with a contact ----
function openChat(user) {
  currentChatWith = user;
  lastTimestamp = 0;

  document.getElementById('contactsScreen').style.display = 'none';
  document.getElementById('chatScreen').style.display = 'flex';
  document.getElementById('chatWithName').textContent = user.displayName;
  document.getElementById('messagesBox').innerHTML = '';
  document.getElementById('titleText').textContent = 'محادثة مع ' + user.displayName;

  loadMessages(true);
  startPolling();
}

function backToContacts() {
  stopPolling();
  document.getElementById('chatScreen').style.display = 'none';
  document.getElementById('contactsScreen').style.display = 'flex';
  document.getElementById('titleText').textContent = 'MSN - ' + currentUser.displayName;
  currentChatWith = null;
}

// ---- Load messages ----
async function loadMessages(scrollToBottom) {
  if (!currentChatWith) return;
  try {
    const result = await api({
      action: 'getMessages',
      user1: currentUser.username,
      user2: currentChatWith.username,
      after: lastTimestamp
    });
    if (result.success && result.messages.length > 0) {
      const box = document.getElementById('messagesBox');
      result.messages.forEach(m => {
        appendMessage(m);
        if (m.timestamp > lastTimestamp) lastTimestamp = m.timestamp;
      });
      if (scrollToBottom) box.scrollTop = box.scrollHeight;
      else box.scrollTop = box.scrollHeight;
    }
  } catch (e) {
    // silent fail on polling
  }
}

function appendMessage(m) {
  const box = document.getElementById('messagesBox');
  const isMe = m.from === currentUser.username;
  const row = document.createElement('div');
  row.className = 'msg-row ' + (isMe ? 'me' : 'them');

  const time = new Date(m.timestamp);
  const timeStr = time.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });

  row.innerHTML = `<div class="bubble">${escapeHtml(m.message)}<div class="meta">${timeStr}</div></div>`;
  box.appendChild(row);
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// ---- Send message ----
async function sendMsg() {
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if (!text || !currentChatWith) return;

  input.value = '';

  // optimistic UI
  const tempMsg = { from: currentUser.username, to: currentChatWith.username, message: text, timestamp: Date.now() };
  appendMessage(tempMsg);
  const box = document.getElementById('messagesBox');
  box.scrollTop = box.scrollHeight;

  try {
    const result = await api({
      action: 'sendMessage',
      from: currentUser.username,
      to: currentChatWith.username,
      message: text
    });
    if (result.success && result.timestamp > lastTimestamp) {
      lastTimestamp = result.timestamp;
    }
  } catch (e) {
    // could show error
  }
}

// ---- Polling ----
function startPolling() {
  stopPolling();
  pollInterval = setInterval(() => loadMessages(false), 3000);
}
function stopPolling() {
  if (pollInterval) clearInterval(pollInterval);
  pollInterval = null;
}

// ---- Restore session ----
window.onload = function() {
  const saved = sessionStorage.getItem('msn_user');
  if (saved) {
    currentUser = JSON.parse(saved);
    showContacts();
  }
};
</script>

</body>
</html>
